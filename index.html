<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIOM — демо / demo</title>
<style>
  /* Glassmorphism числами: blur 18px / saturate 1.4 / стекло .12 / кант 1px .35
     тень 8-32 / радиус 18 / шкала 4-8-12-16-24-32. Числа — на непрозрачной подложке. */
  :root{
    --blur:18px; --sat:1.4; --glass:rgba(255,255,255,.12); --edge:rgba(255,255,255,.35);
    --shadow:0 8px 32px rgba(2,6,23,.38);
    --radius:18px; --ink:#F8FAFC; --muted:#C4CFDE; --accent:#6EE7F9;
    --ok:#34D399; --bad:#FB7185; --warn:#FBBF24;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --cell:rgba(12,20,34,.52);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 620px at 12% 6%, #1E3A8A 0%, transparent 60%),
      radial-gradient(900px 560px at 88% 18%, #0E7490 0%, transparent 58%),
      radial-gradient(820px 700px at 62% 96%, #4C1D95 0%, transparent 62%),
      linear-gradient(160deg,#070B14 0%,#0B1220 52%,#111C2E 100%);
    background-attachment:fixed; min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:var(--s6) var(--s5) 64px}
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
    backdrop-filter:blur(var(--blur)) saturate(var(--sat));
    border:1px solid var(--edge); border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
    padding:var(--s5);
  }
  header.top{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
  .logo{font-size:22px;font-weight:700;letter-spacing:.14em}
  .logo span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  nav{display:flex;gap:var(--s2);margin-left:auto;flex-wrap:wrap;align-items:center}
  nav button{
    font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;
    padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
  }
  nav button[aria-selected="true"]{background:rgba(110,231,249,.26);border-color:var(--accent);color:#EAFEFF;
    box-shadow:0 0 0 1px rgba(110,231,249,.45) inset, 0 4px 14px rgba(110,231,249,.22)}
  .langs{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-left:var(--s2)}
  .langs button{border:0;border-radius:0;padding:8px 12px;font-size:12.5px;letter-spacing:.08em;background:transparent}
  .langs button[data-on="1"]{background:#6EE7F9;color:#06202B;font-weight:700}
  section[hidden]{display:none}
  h1{font-size:26px;margin:0 0 var(--s1);font-weight:650}
  h2{font-size:19px;margin:var(--s5) 0 var(--s3);font-weight:620}
  .row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
  .badge.human{border-color:rgba(167,139,250,.6);color:#DDD6FE}
  .badge.agent{border-color:rgba(244,114,182,.6);color:#FBCFE8}
  .badge.agent::before{content:"◆";font-size:9px}
  .badge.human::before{content:"●";font-size:9px}
  .badge.yes{border-color:rgba(52,211,153,.55)}
  .badge.no{border-color:rgba(251,113,133,.55)}
  .grid{display:grid;grid-template-columns:1.35fr .95fr;gap:var(--s5)}
  @media (max-width:1000px){.grid{grid-template-columns:1fr}}
  .map{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
  @media (max-width:700px){.map{grid-template-columns:1fr}}
  .tile{background:var(--cell);border:1px solid rgba(255,255,255,.10);border-radius:14px;
    padding:var(--s3);cursor:pointer;transition:transform .12s ease, border-color .12s}
  .tile:hover{transform:translateY(-1px);border-color:rgba(110,231,249,.55)}
  .tile.active{background:rgba(110,231,249,.14);border-color:var(--accent);border-left:3px solid var(--accent);
    box-shadow:0 0 0 2px rgba(110,231,249,.35) inset, 0 6px 20px rgba(110,231,249,.12)}
  .tile .chip{background:rgba(110,231,249,.22);border:1px solid var(--accent);color:#EAFEFF;
    border-radius:999px;padding:1px 8px;font-size:11.5px;letter-spacing:.04em}
  .tile .st{font-size:14.5px;font-weight:560;margin:6px 0 var(--s2);min-height:38px;overflow-wrap:break-word}
  .split{height:8px;border-radius:5px;overflow:hidden;display:flex;background:rgba(255,255,255,.08)}
  .split i{display:block;height:100%}
  .split .long{background:linear-gradient(90deg,#34D399,#10B981)}
  .split .short{background:linear-gradient(90deg,#FB7185,#E11D48)}
  .meta{display:flex;justify-content:space-between;gap:var(--s2);color:var(--muted);font-size:13px;margin-top:6px;line-height:1.4}
  .claim{background:var(--cell);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:var(--s4)}
  .claim .st{font-size:17px;font-weight:600;margin:var(--s2) 0;overflow-wrap:break-word}
  .stakes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
  .stakes div{background:rgba(255,255,255,.05);border-radius:12px;padding:var(--s3)}
  .stakes .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .stakes .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
  ul.people{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;gap:6px}
  ul.people li{display:flex;gap:var(--s2);align-items:center;font-size:14px;flex-wrap:wrap}
  ul.people li b{font-weight:600}
  ul.people li em{color:#C4CFDE;font-style:normal;font-size:13px}
  .post{background:var(--cell);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:var(--s4);margin-bottom:var(--s3)}
  .post .txt{font-size:15px;margin:var(--s2) 0 var(--s3)}
  .post .acts{display:flex;gap:var(--s2);flex-wrap:wrap}
  .btn{font:inherit;font-size:13.5px;cursor:pointer;padding:8px 14px;border-radius:10px;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--ink)}
  .btn.primary{background:rgba(110,231,249,.16);border-color:var(--accent);color:#EAFEFF}
  .btn.good{border-color:rgba(52,211,153,.6)}
  .btn.bad{border-color:rgba(251,113,133,.6)}
  .axes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
  @media (max-width:900px){.axes{grid-template-columns:1fr 1fr}}
  @media (max-width:600px){.axes{grid-template-columns:1fr}}
  .axis{background:var(--cell);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:var(--s3)}
  .axis .t{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .axis .band{font-size:17px;font-weight:620;margin:2px 0 0}
  .axis .hint{font-size:13px;color:var(--muted);margin-top:var(--s1);line-height:1.4}
  table.lim{width:100%;border-collapse:collapse;font-size:14px;margin-top:var(--s3)}
  table.lim th,table.lim td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.10);vertical-align:top}
  table.lim th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:13px}
  footer{color:var(--muted);font-size:13px;margin-top:var(--s5);text-align:center}
  .note{border-left:3px solid var(--accent);padding-left:var(--s3);color:#CFF9FF;font-size:13.5px}
  .warn{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#FDE68A;
    border-left:3px solid var(--warn);padding-left:var(--s3);margin-bottom:var(--s3)}
  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;color:#E2E8F3;font-size:13px;margin-top:var(--s3);line-height:1.55;border-top:1px solid rgba(255,255,255,.14);padding-top:var(--s3)}
  .sticky{position:sticky;top:var(--s4)}
</style>
</head>

/* ---- профиль ---- */
function wave(seed) {
  const pts = [];
  for (let i = 0; i < 28; i++) {
    const x = i / 27;
    const v = 0.5 + 0.28 * Math.sin(x * 6.1 + seed) + 0.12 * Math.sin(x * 13.3 + seed * 2)
            + 0.06 * Math.sin(x * 27 + seed * 3);
    pts.push(Math.max(0.06, Math.min(0.96, v)));
  }
  return pts;
}
function sparkline(pts, id) {
  const w = 220, h = 54;
  const d = pts.map((v, i) => `${i ? "L" : "M"}${(i / (pts.length - 1) * w).toFixed(1)},${(h - v * h).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="54" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7F9" stop-opacity=".45"/><stop offset="100%" stop-color="#6EE7F9" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${w},${h} L0,${h} Z" fill="url(#g${id})"/>
    <path d="${d}" fill="none" stroke="#6EE7F9" stroke-width="1.6"/></svg>`;
}

/* ---- каркас, вкладки, язык ---- */
function renderChrome() {
  const t = tr();
  document.documentElement.lang = lang;
  document.getElementById("tagline").textContent = t.tagline;
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  Object.entries(t.tabs).forEach(([id, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.tab = id;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(id === currentTab));
    b.onclick = () => show(id);
    nav.appendChild(b);
  });
  document.querySelectorAll(".langs button").forEach(b => b.dataset.on = String(b.dataset.lang === lang));
  document.getElementById("foot").textContent = t.footer;
}

function show(id) {
  currentTab = id;
  ["map","feed","profile","agents","why"].forEach(x => { document.getElementById(x).hidden = x !== id; });
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderAll() {
  renderChrome();
  renderMap(); renderFeed(); renderProfile(); renderAgents(); renderWhy();
  show(currentTab);
  document.title = lang === "ru" ? "AXIOM — демо: карта мнений" : "AXIOM — demo: opinion map";
}

document.querySelectorAll(".langs button").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem("axiom-lang", lang);
    renderAll();
  };
});
